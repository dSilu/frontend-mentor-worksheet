<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    .attribution { font-size: 0.6875rem; text-align: center; padding-top: 30px;}
    .attribution a { color: hsl(228, 45%, 44%); }

    body {
      background-color: hsl(212, 45%, 89%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Outfit", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 375px;
    }

    .card {
      background-color: hsl(0, 0%, 100%);
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      border-radius: 20px;
      padding: 16px;
    }

    .card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
    }

    .card h1 {
      color: hsl(218, 44%, 22%);
      font-family: "Outfit", sans-serif;
      font-weight: 700;
      font-size: 20px;
      margin: 20px 12px 1px;
    }

    .card p {
      color: hsl(220, 15%, 55%);
      font-family: "Outfit", sans-serif;
      font-weight: 400;
      font-size: 15px;
      margin: 20px 12px 16px;
      line-height: 1.4;
    }

  </style>
</head>
<body>
  <main class="container">
  
    <div class="card">

      <img src="./images/image-qr-code.png">

      <h1>Improve your front-end skills by building projects</h1>

      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>

    </div>

  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">dSilu</a>.
  </footer>
</body>
</html>
